<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Todo App</title>
</head>
<body class="mx-5 mb-5 d-flex flex-column gap-5 justify-content-center align-items-center">
    <section class="bg-black px-4 py-2 w-50 mt-1 rounded">
        <form class="taskForm">
            <h1 class="text-white">Add New Task</h1>
            <div class="mb-3">
                <label for="taskName" class="form-label text-white">Task Name</label>
                <input placeholder="Enter Task Name" type="text" class="taskName form-control " >
            </div>
            <div class="mb-3">
                <label for="taskDescription" class="form-label text-white">Task Description</label>
                <input placeholder="Enter Task Description" type="text" class="taskDescription form-control" >
            </div>
            <button  type="button" class="btn btn-primary " id="addBtn" onclick="addbtn()">Add</button>
        </form>
    </section>

    <table class="table table-striped table-dark">
        <thead>
            <tr>
                <th scope="col">Task Name</th>
                <th scope="col">Task Description</th>
                <th scope="col">Actions</th>
            </tr>
        </thead>
        <tbody class="tasksBody"></tbody>
    </table>

    
    <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content bg-black">
            <div class="modal-header border-secondary">
                <h5 class="modal-title text-white">Edit Task</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label text-white">Task Name</label>
                    <input type="text" class="form-control" id="editName">
                </div>
                <div class="mb-3">
                    <label class="form-label text-white">Task Description</label>
                    <input type="text" class="form-control" id="editDesc">
                </div>
            </div>
            <div class="modal-footer border-secondary">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="saveEditBtn">Save</button>
            </div>
        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="./script.js"></script>
</body>
</html>
